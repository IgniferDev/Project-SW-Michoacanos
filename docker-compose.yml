services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: agm
      POSTGRES_PASSWORD: agm_dev_password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agm -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agm.com
      PGADMIN_DEFAULT_PASSWORD: Admin123!
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-auth:
    build:
      context: .
      dockerfile: ms-auth/Dockerfile
    env_file:
      - ms-auth/.env
    ports:
      - "8011:8011"
    depends_on:
      postgres:
        condition: service_healthy

  ms-periods:
    build:
      context: .
      dockerfile: ms-periods/Dockerfile
    env_file:
      - ms-periods/.env
    ports:
      - "8012:8012"
    depends_on:
      postgres:
        condition: service_healthy
      ms-auth:
        condition: service_started
      ms-academics:
        condition: service_started

  ms-academics:
    build:
      context: .
      dockerfile: ms-academics/Dockerfile
    env_file:
      - ms-academics/.env
    ports:
      - "8013:8013"
    depends_on:
      postgres:
        condition: service_healthy
      ms-auth:
        condition: service_started
      ms-notifications:
        condition: service_started

  ms-grades:
    build:
      context: .
      dockerfile: ms-grades/Dockerfile
    env_file:
      - ms-grades/.env
    ports:
      - "8014:8014"
    depends_on:
      postgres:
        condition: service_healthy
      ms-auth:
        condition: service_started
      ms-periods:
        condition: service_started
      ms-academics:
        condition: service_started

  ms-attendance:
    build:
      context: .
      dockerfile: ms-attendance/Dockerfile
    env_file:
      - ms-attendance/.env
    ports:
      - "8015:8015"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ms-auth:
        condition: service_started
      ms-academics:
        condition: service_started

  ms-notifications:
    build:
      context: .
      dockerfile: ms-notifications/Dockerfile
    env_file:
      - ms-notifications/.env
    ports:
      - "8016:8016"
    depends_on:
      postgres:
        condition: service_healthy

  ms-reports:
    build:
      context: .
      dockerfile: ms-reports/Dockerfile
    env_file:
      - ms-reports/.env
    ports:
      - "8017:8017"
    depends_on:
      postgres:
        condition: service_healthy
      ms-auth:
        condition: service_started
      ms-periods:
        condition: service_started
      ms-academics:
        condition: service_started
      ms-grades:
        condition: service_started
      ms-attendance:
        condition: service_started

volumes:
  postgres_data: