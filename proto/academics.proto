syntax = "proto3";

package agm.academics;

service AcademicsService {
  rpc GetAlumnosByMateria(MateriaIdRequest) returns (AlumnoList);
  rpc GetAlumnoById(AlumnoIdRequest) returns (AlumnoInfo);
  rpc IsAlumnoEnMateria(AlumnoMateriaRequest) returns (BoolReply);
  rpc GetDocenteById(DocenteIdRequest) returns (DocenteInfo);
  rpc FindDocenteByName(NameRequest) returns (DocenteInfo);
}

message MateriaIdRequest {
  int64 materia_id = 1;
}

message AlumnoIdRequest {
  int64 alumno_id = 1;
}

message DocenteIdRequest {
  int64 docente_id = 1;
}

message NameRequest {
  string name = 1;
}

message AlumnoMateriaRequest {
  int64 alumno_id = 1;
  int64 materia_id = 2;
}

message BoolReply {
  bool ok = 1;
  string message = 2;
}

message AlumnoInfo {
  int64 alumno_id = 1;
  string matricula = 2;
  string nombre = 3;
  string email = 4;
  string status = 5;
  string nivel = 6;
  bool activo = 7;
}

message AlumnoList {
  repeated AlumnoInfo items = 1;
}

message DocenteInfo {
  int64 docente_id = 1;
  string nombre = 2;
  string email = 3;
  string ubicacion = 4;
  string extension = 5;
}
